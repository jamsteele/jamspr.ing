<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Library — A room of short stories</title>
  <meta name="description" content="A cozy illustrated room of public-domain short stories from around the world. They just stepped out — feel free to poke around.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Horizontally-scrollable room.
       The .room element is as wide as the painting's natural aspect at full
       viewport height. On phone the room is wider than viewport → swipe to
       explore. On desktop the room usually fits without scrolling. -->
  <div class="room-wrapper" id="room-wrapper">
    <main class="room" id="room" aria-label="An illustrated room with clickable objects. Scroll horizontally to explore.">
      <!-- Layered background:
           1. .parallax-mountains — clean wide mountain texture (no window
              frame), behind everything; shifts slower than scroll for depth.
           2. .room-fg — the painted room with the inside of both window
              panes cleared to transparent so the mountains show through.
           Future: chair back at corners (59.63%, 71.11%), (38.61%, 76.91%),
           (37.03%, 99.47%), (56.11%, 99.47%) — could become a foreground
           parallax layer if extracted as a transparent PNG. -->
      <img class="parallax-mountains" id="parallax-mountains" src="assets/mountains.png" alt="" aria-hidden="true">
      <img class="room-fg" src="assets/room2_layered.png" alt="" aria-hidden="true">

      <!-- Painted-lights overlay: invisible glow-dots positioned over each
           painted fairy light in the room, animated with mix-blend-mode: screen.
           Each twinkles on its own delay, making the painted lights themselves
           appear to pulse softly. Populated by setupPaintedLights() in script.js. -->
      <div class="painted-lights" id="painted-lights" aria-hidden="true"></div>

      <!-- Mug steam: 3 SVG wisps rising from the orange mug's rim. Each rises
           on its own delay so the steam appears continuous. The painted mug
           reads as "still hot — she just stepped out." -->
      <div class="mug-steam" aria-hidden="true">
        <svg class="steam-wisp wisp-1" viewBox="0 0 20 100" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
          <path d="M10 100 Q4 80 12 60 Q16 40 8 22 Q10 8 10 0" stroke="white" stroke-width="6" fill="none" stroke-linecap="round"/>
        </svg>
        <svg class="steam-wisp wisp-2" viewBox="0 0 20 100" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
          <path d="M10 100 Q16 78 8 58 Q4 38 14 20 Q10 6 10 0" stroke="white" stroke-width="6" fill="none" stroke-linecap="round"/>
        </svg>
        <svg class="steam-wisp wisp-3" viewBox="0 0 20 100" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
          <path d="M10 100 Q12 82 6 62 Q14 42 9 22 Q11 8 10 0" stroke="white" stroke-width="6" fill="none" stroke-linecap="round"/>
        </svg>
      </div>

      <!-- Breathing cat: two overlays from the same cat.png cut-out.
           - .cat-body: shows only the middle (chest/back), scales with breath
           - .cat-headtail: shows only the left (head) + right (tail/paws),
             translates slightly so they bob with the body but don't change size
           Complementary CSS masks so the two layers cover the painted cat
           between them with no overlap. -->
      <img class="cat-body" src="assets/cat.png" alt="" aria-hidden="true">
      <img class="cat-headtail" src="assets/cat.png" alt="" aria-hidden="true">

      <!-- Easter egg trigger: invisible click target over the painted cherry
           blossom sprig framed on the wall (top-left of the room, beside
           the window). Click it 3× → petals drift down from it + fairy
           lights pulse in a wave. Coordinates from /library?annotate. -->
      <button class="cherry-sprig" id="cherry-sprig" aria-label="A small framed painting of a cherry blossom sprig"></button>

      <!-- Petal layer — petals spawn from the painted cherry sprig and
           drift down + outward into the room. Lives inside .room so it
           scrolls horizontally with the painting. -->
      <div class="petal-layer" id="petal-layer" aria-hidden="true"></div>
    </main>
    <!-- Scroll affordance: subtle gradient fades at the edges suggest "more room over there" -->
    <div class="scroll-hint scroll-hint-right" aria-hidden="true"></div>
    <div class="scroll-hint scroll-hint-left" aria-hidden="true"></div>
  </div>

  <!-- Reader modal -->
  <div class="modal" id="reader" hidden aria-hidden="true">
    <div class="modal-backdrop" data-close></div>
    <article class="modal-content" role="dialog" aria-modal="true" aria-labelledby="story-title">
      <button class="modal-close" data-close aria-label="Close story">×</button>
      <header class="story-header">
        <p class="story-eyebrow"><span class="story-flag"></span> <span class="story-country"></span></p>
        <h1 id="story-title"></h1>
        <p class="story-meta">
          <span class="story-author"></span>
          <span class="story-sep">·</span>
          <span class="story-mins"></span>
        </p>
        <p class="story-note" id="story-note" hidden></p>
      </header>
      <div class="story-content" id="story-content"></div>
    </article>
  </div>

  <!-- Markdown parser (small, ~30KB) -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
