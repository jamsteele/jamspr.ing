<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Library — A room of short stories</title>
  <meta name="description" content="A cozy illustrated room of public-domain short stories from around the world. They just stepped out — feel free to poke around.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Horizontally-scrollable room.
       The .room element is as wide as the painting's natural aspect at full
       viewport height. On phone the room is wider than viewport → swipe to
       explore. On desktop the room usually fits without scrolling. -->
  <div class="room-wrapper" id="room-wrapper">
    <main class="room" id="room" aria-label="An illustrated room with clickable objects. Scroll horizontally to explore.">
      <!-- Painted-lights overlay: invisible glow-dots positioned over each
           painted fairy light in the room, animated with mix-blend-mode: screen.
           Each twinkles on its own delay, making the painted lights themselves
           appear to pulse softly. Populated by setupPaintedLights() in script.js. -->
      <div class="painted-lights" id="painted-lights" aria-hidden="true"></div>

      <!-- Breathing cat: two overlays from the same cat.png cut-out.
           - .cat-body: shows only the middle (chest/back), scales with breath
           - .cat-headtail: shows only the left (head) + right (tail/paws),
             translates slightly so they bob with the body but don't change size
           Complementary CSS masks so the two layers cover the painted cat
           between them with no overlap. -->
      <img class="cat-body" src="assets/cat.png" alt="" aria-hidden="true">
      <img class="cat-headtail" src="assets/cat.png" alt="" aria-hidden="true">

      <!-- Easter egg: cherry-blossom sprig overlaid on the windowsill.
           Click it 3× → drift petals across the room + fairy lights wave.
           (The painting's own fairy lights also pulse in the wave.) -->
      <button class="cherry-sprig" id="cherry-sprig" aria-label="A small cherry blossom sprig in a glass jar">
        <svg viewBox="0 0 60 80" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M18 60 L18 78 Q18 80 20 80 L40 80 Q42 80 42 78 L42 60 Z" fill="rgba(180,210,220,0.45)" stroke="rgba(180,210,220,0.7)" stroke-width="0.8"/>
          <ellipse cx="30" cy="60" rx="12" ry="2" fill="rgba(180,210,220,0.6)"/>
          <path d="M30 58 Q28 45 24 35 Q21 28 18 22" stroke="#5a3a28" stroke-width="1.5" fill="none" stroke-linecap="round"/>
          <path d="M28 50 Q33 42 38 36" stroke="#5a3a28" stroke-width="1.2" fill="none" stroke-linecap="round"/>
          <circle cx="18" cy="22" r="3.5" fill="#f8c8d4"/>
          <circle cx="22" cy="28" r="2.5" fill="#fadbe2"/>
          <circle cx="38" cy="35" r="3" fill="#f8c8d4"/>
          <circle cx="33" cy="42" r="2.5" fill="#fadbe2"/>
          <circle cx="26" cy="38" r="2.2" fill="#f8c8d4"/>
          <circle cx="18" cy="22" r="0.8" fill="#d97a8c"/>
          <circle cx="38" cy="35" r="0.7" fill="#d97a8c"/>
        </svg>
      </button>
    </main>
    <!-- Scroll affordance: subtle gradient fades at the edges suggest "more room over there" -->
    <div class="scroll-hint scroll-hint-right" aria-hidden="true"></div>
    <div class="scroll-hint scroll-hint-left" aria-hidden="true"></div>
  </div>

  <!-- Petal layer — fixed-position, sits over everything when easter egg fires -->
  <div class="petal-layer" id="petal-layer" aria-hidden="true"></div>

  <!-- Reader modal -->
  <div class="modal" id="reader" hidden aria-hidden="true">
    <div class="modal-backdrop" data-close></div>
    <article class="modal-content" role="dialog" aria-modal="true" aria-labelledby="story-title">
      <button class="modal-close" data-close aria-label="Close story">×</button>
      <header class="story-header">
        <p class="story-eyebrow"><span class="story-flag"></span> <span class="story-country"></span></p>
        <h1 id="story-title"></h1>
        <p class="story-meta">
          <span class="story-author"></span>
          <span class="story-sep">·</span>
          <span class="story-mins"></span>
        </p>
        <p class="story-note" id="story-note" hidden></p>
      </header>
      <div class="story-content" id="story-content"></div>
    </article>
  </div>

  <!-- Markdown parser (small, ~30KB) -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
